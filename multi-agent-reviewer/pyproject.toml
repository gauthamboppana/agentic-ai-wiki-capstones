[project]
name = "multi-agent-reviewer"
version = "0.1.0"
description = "Stateful multi-agent reviewer: planner, investigator, fixer and critic over MCP tools, with checkpoints, memory and an approval gate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The official MCP SDK, if you want to swap the stdlib server and client for it (see README).
mcp = ["mcp>=1.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
