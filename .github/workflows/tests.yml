name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capstone: [research-assistant, pdf-rag, multi-agent-reviewer, production-hardening]
    defaults:
      run:
        working-directory: ${{ matrix.capstone }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
  eval-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production-hardening
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python scripts/ci_gate.py
