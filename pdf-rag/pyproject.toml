[project]
name = "pdfrag"
version = "0.1.0"
description = "Hybrid-search question answering over technical documents with page citations (capstone reference solution)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Real PDF parsing. The bundled corpus is page-marked JSON, so tests never need this.
pdf = ["pypdf>=4.0"]
# A real dense embedding model and a real cross-encoder reranker (both downloaded on first use).
models = ["sentence-transformers>=3.0"]
# A real vector database behind the same VectorStore interface.
qdrant = ["qdrant-client>=1.9"]

[project.scripts]
pdfrag = "pdfrag.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
