[project]
name = "research-assistant"
version = "0.1.0"
description = "Structured research assistant: reads an article, streams progress, returns validated JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
